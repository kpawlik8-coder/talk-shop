[project]
name = "talk-shop"
version = "0.1.0"
description = "Rule-based shop chatbot answering questions about prices and stock."
readme = "README.md"
authors = [
    { name = "Kacper Pawlik", email = "kpawlik8@st.swps.edu.pl" }
]
requires-python = ">=3.13"
dependencies = ["lark>=1.3.0,<2"]

[project.scripts]
talk-shop = "talk_shop:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "coverage",
    "pre-commit",
    "ipython",
    "pylint"
]